name: Build BLVietsub CloudStream

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip & Structure Project
        run: |
          # 1. Giải nén file zip
          unzip -o *.zip -d . || true

          # 2. Chuyển code từ thư mục con ra ngoài thư mục gốc
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -o -name "build.gradle.kts" | head -n 1 | xargs -r dirname)
          if [ -n "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
            echo "Chuyển code từ $PROJECT_DIR ra thư mục gốc..."
            cp -r $PROJECT_DIR/* . 2>/dev/null || true
            cp -r $PROJECT_DIR/.* . 2>/dev/null || true
          fi

          # 3. Tạo gradlew 8.9 nếu thiếu
          if [ ! -f "gradlew" ]; then
            echo "Khởi tạo Gradle 8.9 Wrapper..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Build CloudStream Extensions
        run: ./gradlew makePlugins

      - name: Upload .cs3 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLVietsub-CloudStream-Plugins
          path: "**/*.cs3"
