name: Build BLVietsub CloudStream

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip & Fix Extension Source
        run: |
          # 1. Giải nén file zip
          unzip -o *.zip -d . || true

          # 2. Đưa code từ thư mục con ra ngoài thư mục gốc
          PROJECT_DIR=$(find . -maxdepth 3 -name "build.gradle.kts" -not -path "./build.gradle.kts" | head -n 1 | xargs -r dirname)
          if [ -n "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
            echo "Di chuyển code từ $PROJECT_DIR ra root..."
            cp -r $PROJECT_DIR/* . 2>/dev/null || true
            cp -r $PROJECT_DIR/.* . 2>/dev/null || true
          fi

          # 3. Sửa lỗi cú pháp dir.name trong settings.gradle.kts gốc
          if [ -f "settings.gradle.kts" ]; then
            sed -i 's/dir\.name/it\.name/g' settings.gradle.kts
          fi

          # 4. Sửa lỗi Jitpack 401 (chuyển master-SNAPSHOT -> -SNAPSHOT)
          find . -name "*.gradle.kts" -exec sed -i 's/master-SNAPSHOT/-SNAPSHOT/g' {} +

          # 5. Khởi tạo Gradle Wrapper 8.9 nếu thiếu
          if [ ! -f "gradlew" ]; then
            echo "Tạo Gradle Wrapper 8.9..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Build CloudStream Extensions
        run: ./gradlew makePlugins

      - name: Upload .cs3 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLVietsub-CloudStream-Plugins
          path: "**/*.cs3"
