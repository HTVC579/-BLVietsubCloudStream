name: Build BLVietsub CloudStream

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unzip & Fix Project Settings
        run: |
          # 1. Giải nén zip
          unzip -o *.zip -d . || true

          # 2. Đưa code từ thư mục con ra gốc nếu bị lồng
          PROJECT_DIR=$(find . -maxdepth 3 -name "build.gradle.kts" -not -path "./build.gradle.kts" | head -n 1 | xargs -r dirname)
          if [ -n "$PROJECT_DIR" ] && [ "$PROJECT_DIR" != "." ]; then
            echo "Di chuyển code từ $PROJECT_DIR..."
            cp -r $PROJECT_DIR/* . 2>/dev/null || true
            cp -r $PROJECT_DIR/.* . 2>/dev/null || true
          fi

          # 3. Tạo lại settings.gradle.kts chuẩn Kotlin DSL
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = "CloudstreamPlugins"

          java.io.File(rootDir, ".").listFiles()?.forEach { dir ->
              if (dir.isDirectory && java.io.File(dir, "build.gradle.kts").exists()) {
                  include(":${dir.name}")
              }
          }
          EOF

          # 4. Tạo gradlew 8.9 nếu thiếu
          if [ ! -f "gradlew" ]; then
            echo "Tạo Gradle Wrapper..."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      - name: Build CloudStream Extensions
        run: ./gradlew makePlugins

      - name: Upload .cs3 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BLVietsub-CloudStream-Plugins
          path: "**/*.cs3"
